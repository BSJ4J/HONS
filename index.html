<!DOCTYPE html>
<html>

<head>

    <title>Lucky Draw</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background: #f7f7f7;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 35px 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 14px;
            font-size: 16px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 14px 25px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .popup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            padding: 20px;
        }

        .popup-content {
            background: white;
            max-width: 400px;
            margin: 120px auto;
            padding: 35px;
            border-radius: 15px;
        }

        .prize {
            font-size: 25px;
            font-weight: bold;
            margin: 25px 0;
        }

        .survey-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 25px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .error {
            color: #c00;
            margin-top: 15px;
        }

        .loading {
            display: none;
            margin-top: 15px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🎁 Lucky Draw</h1>

    <p>
        Enter your email address to claim your prize.
    </p>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email">

    <br>

    <button
        id="claimButton"
        onclick="claimPrize()">

        Claim Prize

    </button>

    <div
        class="loading"
        id="loading">

        🎲 Selecting your prize...

    </div>

    <div
        class="error"
        id="error">
    </div>

</div>


<!-- POPUP -->

<div
    class="popup"
    id="popup">

    <div class="popup-content">

        <h2 id="popupTitle">
            Congratulations! 🎉
        </h2>

        <p id="prizeText"></p>

<div id="claimDetails" style="
    margin-top:15px;
    text-align:left;
    background:#f5f5f5;
    padding:12px;
    border-radius:8px;
    font-size:14px;
">
</div>

        <a
            class="survey-btn"
            href="https://forms.gle/88UK1djw5bXE7ZNw8"
            target="_blank">

            Complete Survey

        </a>

    </div>

</div>


<script>


// =====================================================
// PUT YOUR GOOGLE APPS SCRIPT URL HERE
// =====================================================

const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbx8wi6IPVcXxWMANCARnqvnXV5aH8JncOi7tv7DxmecoA-8LoXzfX4B-j8cuOsaHwQTJQ/exec";
    function startAutoRedirect() {
    setTimeout(() => {
        window.location.href =
            "https://forms.gle/88UK1djw5bXE7ZNw8";
    }, 10000); // 10 seconds
}


// =====================================================
// CLAIM PRIZE
// =====================================================

async function claimPrize() {

    const emailInput =
        document.getElementById("email");

    const button =
        document.getElementById("claimButton");

    const loading =
        document.getElementById("loading");

    const error =
        document.getElementById("error");


    const email =
        emailInput.value.trim();


    // -----------------------------------------------
    // Validate email
    // -----------------------------------------------

    if (!email) {

        error.innerText =
            "Please enter your email address.";

        return;
    }


    const emailRegex =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if (!emailRegex.test(email)) {

        error.innerText =
            "Please enter a valid email address.";

        return;
    }


    // -----------------------------------------------
    // Disable button
    // -----------------------------------------------

    button.disabled = true;

    error.innerText = "";

    loading.style.display = "block";


    try {

        const data =
            new URLSearchParams();

        data.append("action", "claim");
        data.append("email", email);


        const response =
            await fetch(
                SCRIPT_URL,
                {
                    method: "POST",
                    body: data
                }
            );


        const result =
            await response.json();


        loading.style.display = "none";


        // -------------------------------------------
        // Already claimed
        // -------------------------------------------

        if (result.alreadyClaimed) {

            document.getElementById("popupTitle")
                .innerText =
                "Already Claimed";

            document.getElementById("prizeText")
                .innerText =
                "This email has already claimed: " +
                result.prize;

            document.getElementById("popup")
    .style.display =
    "block";

startAutoRedirect();

            button.disabled = false;

            return;
        }


        // -------------------------------------------
        // Successful claim
        // -------------------------------------------

        if (result.success) {

            document.getElementById("popupTitle")
                .innerText =
                "Congratulations! 🎉";

            document.getElementById("prizeText")
    .innerText =
    "You won: " + result.prize;

document.getElementById("claimDetails")
    .innerHTML =
    "<strong>Email:</strong> " + result.email + "<br>" +
    "<strong>Prize:</strong> " + result.prize + "<br>" +
    "<strong>Time (ISO-8601):</strong> " + result.claimTime;
           document.getElementById("popup")
    .style.display =
    "block";

startAutoRedirect();

            return;
        }


        // -------------------------------------------
        // Error
        // -------------------------------------------

        error.innerText =
            result.message ||
            "Something went wrong.";

        button.disabled = false;


    } catch (err) {

        loading.style.display = "none";

        error.innerText =
            "Unable to connect to the prize system. Please try again.";

        button.disabled = false;

    }

}


</script>

</body>

</html>
