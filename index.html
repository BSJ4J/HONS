<!DOCTYPE html>
<html>
<head>
    <title>Lucky Draw</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
        }

        .popup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
        }

        .popup-content {
            background: white;
            max-width: 400px;
            margin: 120px auto;
            padding: 30px;
            border-radius: 12px;
        }

        .survey-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>🎁 Lucky Draw</h1>
    <p>Click below to claim your prize!</p>

    <button onclick="drawPrize()">Claim Prize</button>

    <div class="popup" id="popup">
        <div class="popup-content">
            <h2>Congratulations!</h2>

            <p id="prizeText"></p>

            <a
                class="survey-btn"
                href="https://forms.gle/88UK1djw5bXE7ZNw8"
                target="_blank">
                Complete Survey
            </a>
        </div>
    </div>

    <script>
        const prizes = [
            "10% Discount Voucher",
            "15% Discount Voucher",
            "Free Drink",
            "Free Service Upgrade",
            "Thank You Gift"
        ];

        function drawPrize() {
            const randomIndex =
                Math.floor(Math.random() * prizes.length);

            const prize = prizes[randomIndex];

            document.getElementById("prizeText").innerText =
                "You won: " + prize;

            document.getElementById("popup").style.display =
                "block";
        }
    </script>

</body>
</html>
